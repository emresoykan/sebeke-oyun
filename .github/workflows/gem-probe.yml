# Geçici: GEM indirme sayfasının yapısını okur (yalnızca okuma; form gönderilmez). İş bitince silinecek.
name: GEM sayfa yoklaması
on:
  push:
    branches: [claude/vite-modular-game-hi6q24]
    paths: [.github/workflows/gem-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for U in https://globalenergymonitor.org/download-data https://globalenergymonitor.org/projects/global-integrated-power-tracker/download-data/#download; do
            echo "=== $U"; curl -sSL -A "Mozilla/5.0" "$U" -o p.html -w "son adres: %{url_effective} durum: %{http_code}\n"; echo "boyut: $(wc -c < p.html)"
            grep -oiE '<form[^>]*>|<(input|select|textarea)[^>]*name="[^"]*"[^>]*>|<label[^>]*>[^<]{2,80}' p.html | sed -E 's/class="[^"]*"//g' | sort -u | head -60
            grep -oiE 'https?://[^"'"'"' ]+\.(xlsx|csv|zip)' p.html | sort -u | head
            sed -e 's/<[^>]*>/ /g' p.html | tr -s ' \n' | grep -iE 'terms|agree|email|organization|purpose|download' | head -20
          done
