# Türkiye'deki santralleri OpenStreetMap'ten (Overpass API) çekip public/data/plants-tr.json dosyasına yazar ve aynı dala
# commit eder ("Gerçek santraller" harita katmanı). Elle (workflow_dispatch) ya da betik veya bu dosya değişince çalışır.
# Veri: © OpenStreetMap katkıcıları, ODbL 1.0.
name: OSM santral verisi

on:
  workflow_dispatch:
  push:
    branches: [claude/vite-modular-game-hi6q24]
    paths: [scripts/build_osm_plants.py, .github/workflows/osm-plants.yml]

permissions:
  contents: write

concurrency:
  group: osm-plants
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_osm_plants.py public/data/plants-tr.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/plants-tr.json
          if git diff --cached --quiet; then echo "Değişiklik yok"; else git commit -m "OSM santral verisi güncellendi (Türkiye)"; git push; fi
