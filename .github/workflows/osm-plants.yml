# Dünyadaki santralleri OpenStreetMap'ten çekip public/data/plants/ altına ülke dosyaları olarak yazar ve aynı dala commit
# eder ("Gerçek santraller" harita katmanı). Overpass API'nin ortak sunucuları dünya taraması için güvenilir değil (18.10.2026
# denemesinde 6 saat boyunca çoğunlukla HTTP 502/500/504 döndü); bu yüzden Geofabrik'in kıta çıkarımları indirilir ve
# osmium ile yalnızca santraller ve rüzgâr türbinleri süzülür. Her kıta ayrı işte işlenir (en çok 4 iş aynı anda), ham
# sonucunu yükler; son iş hepsini birleştirip ülke dosyalarını üretir. Başarısız bir kıta diğerlerini engellemez.
# Elle (workflow_dispatch) ya da betik veya bu dosya değişince çalışır. Veri: © OpenStreetMap katkıcıları, ODbL 1.0.
name: OSM santral verisi

on:
  workflow_dispatch:
    inputs:
      reuse_run:
        description: "Kıta verisini bu çalıştırmanın ham dosyalarından al (çalıştırma kimliği); boşsa yeniden indir"
        required: false
        default: ""
  push:
    branches: [claude/vite-modular-game-hi6q24]
    paths: [scripts/build_osm_plants.py, .github/workflows/osm-plants.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: osm-plants
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ !inputs.reuse_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: [africa, asia, australia-oceania, central-america, europe, north-america, russia, south-america]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Disk alanı aç (Avrupa ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h .
      - run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool && pip install osmium==4.3.1
      - name: İndir ve süz
        run: |
          curl -fL --retry 5 --retry-delay 30 -o region.osm.pbf "https://download.geofabrik.de/${{ matrix.region }}-latest.osm.pbf"
          ls -la region.osm.pbf
          osmium tags-filter region.osm.pbf nwr/power=plant n/generator:source=wind -o plants.osm.pbf --overwrite
          rm region.osm.pbf; ls -la plants.osm.pbf
      - run: python3 -u scripts/build_osm_plants.py --pbf plants.osm.pbf --raw raw-${{ matrix.region }}.json.gz --harvest-only
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.region }}
          path: raw-${{ matrix.region }}.json.gz
          retention-days: 7

  # iptal edilen çalıştırmada birleştirme yapılmaz (eksik veri commit edilmesin); 8 kıtanın hepsi yoksa commit edilmez
  build:
    needs: extract
    if: ${{ !cancelled() && (needs.extract.result == 'success' || inputs.reuse_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely==2.1.2
      - uses: actions/download-artifact@v4
        with:
          pattern: raw-*
          merge-multiple: true
          run-id: ${{ inputs.reuse_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sekiz kıta da var mı
        run: |
          n=$(ls raw-*.json.gz | wc -l); echo "ham dosya: $n"; test "$n" -eq 8
      - run: ls -la raw-*.json.gz && python3 -u scripts/build_osm_plants.py public/data/plants --merge raw-*.json.gz
      # GEM ile birleştirilen ülkeler (gem-plants.yml): ara dosya varsa yeniden uygulanır
      - name: GEM birleştirmesi
        run: |
          for f in data/gem/gipt-*.json; do [ -e "$f" ] && python3 -u scripts/merge_gem.py --apply "$f" public/data/plants; done; true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch public/data/plants-tr.json
          git add -A public/data/plants
          du -sh public/data/plants; ls -S public/data/plants | head -5
          # veri dosyaları baştan üretildiği için dalın son hâlinin üstüne kopyalanır (rebase çakışması olmaz)
          cp -r public/data/plants /tmp/plants-new
          git fetch -q origin "${GITHUB_REF_NAME}" && git reset -q --hard "origin/${GITHUB_REF_NAME}"
          rm -rf public/data/plants && cp -r /tmp/plants-new public/data/plants
          git rm -q --ignore-unmatch public/data/plants-tr.json
          git add -A public/data/plants
          if git diff --cached --quiet; then echo "Değişiklik yok"; else git commit -m "OSM santral verisi güncellendi (dünya)"; git push origin "HEAD:${GITHUB_REF_NAME}"; fi
